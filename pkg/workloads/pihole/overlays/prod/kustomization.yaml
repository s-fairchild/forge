---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: configmaps/custom-local-records.yaml
  - path: configmaps/pihole-cname-records.yaml

secretGenerator:
  - name: web-password
    namespace: pihole
    behavior: replace
    files:
      - secrets/web.password.txt
    options:
      disableNameSuffixHash: true
