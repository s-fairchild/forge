;# * ..V... = Video codec
;# * ..A... = Audio codec
;# * ..S... = Subtitle codec
;# * ..D... = Data codec
;# * ..T... = Attachment codec
;# * ...I.. = Intra frame-only codec
;# * ....L. = Lossy compression
;# * .....S = Lossless compression
;#
;# * DEV.L. av1                  Alliance for Open Media AV1 (decoders: av1 av1_qsv) (encoders: av1_vaapi)
;# * DEV.LS h264                 H.264 / AVC / MPEG-4 AVC / MPEG-4 part 10 (decoders: h264 h264_v4l2m2m h264_qsv) (encoders: libx264 libx264rgb h264_qsv h264_v4l2m2m h264_vaapi)
;# * DEV.L. hevc                 H.265 / HEVC (High Efficiency Video Coding) (decoders: hevc hevc_qsv hevc_v4l2m2m) (encoders: libx265 hevc_qsv hevc_v4l2m2m hevc_vaapi)
;# * DEVIL. mjpeg                Motion JPEG (decoders: mjpeg mjpeg_qsv) (encoders: mjpeg mjpeg_qsv mjpeg_vaapi)
;# * DEV.L. mpeg2video           MPEG-2 video (decoders: mpeg2video mpegvideo mpeg2_v4l2m2m mpeg2_qsv) (encoders: mpeg2video mpeg2_qsv mpeg2_vaapi)
;# * D.V.L. vc1                  SMPTE VC-1 (decoders: vc1 vc1_qsv vc1_v4l2m2m)
;# * DEV.L. vp8                  On2 VP8 (decoders: vp8 vp8_v4l2m2m libvpx vp8_qsv) (encoders: libvpx vp8_v4l2m2m vp8_vaapi)
;# * DEV.L. vp9                  Google VP9 (decoders: vp9 vp9_v4l2m2m libvpx-vp9 vp9_qsv) (encoders: libvpx-vp9 vp9_vaapi vp9_qsv)

