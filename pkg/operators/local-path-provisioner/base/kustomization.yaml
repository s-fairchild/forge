---
resources:
  - helmcharts/local-path-provisioner.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: local-path-provisioner-values
    namespace: kube-system
    files:
      - values/values.yaml

# https://github.com/kubernetes-sigs/kustomize/issues/815#issuecomment-722675365
crds:
  - crds/helmcharts-cattle-openapi-spec.yaml
