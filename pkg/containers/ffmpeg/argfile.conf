# ffmpeg build args
# Values should not be wrapped in quotes. This breaks things due to how builda expands args.
#   * Reference: https://github.com/containers/buildah/issues/5945

### Build and release container image ###

IMAGE_REGISTRY=docker.io
IMAGE_REPOSITORY=library/ubuntu
IMAGE_TAG=24.04

### Git source ###

# https://github.com/FFmpeg/FFmpeg/tree/master
# Reference: https://github.com/FFmpeg/FFmpeg/tree/n6.1.4
FFMPEG_VERSION=n6.1.4

### Configure make options ###

# Tooling options
BUILD_THREADS=1
PREFIX=/usr/local

# General configure options
CONFIGURE_GENERAL=--enable-shared --enable-pthreads --enable-runtime-cpudetect
# configure --env=""
# configure licensing options
CONFIGURE_LICENSE=--enable-gpl --enable-version3

# Excluded options
MAKE_EXCLUDE=--disable-x86asm --disable-doc

### Release Environment ###

# Set this to use free iHD driver use.
# Default is non free i965 driver.
#
#   * Reference: https://trac.ffmpeg.org/wiki/Hardware/QuickSync#i965vs.iHDDrivervs.libvpllibmfx
LIBVA_DRIVER_NAME=iHD
