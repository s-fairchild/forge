---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# KubeVirt v1.9.0 custom resource -- https://github.com/kubevirt/kubevirt/releases/tag/v1.9.0
#
# Applied directly to the k3d/KubeVirt host cluster (hack/lib/kubevirt/kubevirt.sh) after
# ../operator's Deployment is Available -- see that kustomization's comment for why these
# are split. Deliberately flat (no base/staging/prod subdirectories) for the same reason.
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-cr.yaml
# KubeVirt v1.9.0 operator -- https://github.com/kubevirt/kubevirt/releases/tag/v1.9.0
#
# Applied directly to the k3d/KubeVirt host cluster (hack/lib/kubevirt/kubevirt.sh),
# not embedded into any FCOS node's ignition-delivered k3s manifests -- deliberately
# flat (no base/staging/prod subdirectories anywhere under pkg/operators/kubevirt/) so
# kube-manifests-gen.sh's `find pkg -type d -name "$overlay"` traversal can never match
# anything under here.
#
# Kept separate from ../cr (the KubeVirt custom resource) because the CR's CRD is
# registered by this operator -- applying both in one batch races the CRD not existing
# yet; kubevirt_install() applies and waits on this one first.
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-operator.yaml
