---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtsp0
  namespace: v4l2rtspserver
  labels:
    app: rtsp0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rtsp0
  template:
    metadata:
      name: rtsp0
      namespace: v4l2rtspserver
      labels:
        app: rtsp0
    spec:
      # Another useful option for scheduling is the usb vendor code.
      # It's applied as a label via nfd operator.
      # Example:
      #   * feature.node.kubernetes.io/usb-ef_32e4_9310.present: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: rtsp
                  operator: In
                  values:
                    - "0"
      containers:
        # TODO setup multicast network once motion is deployed
        # TODO Add IngressRouteTCP and IngressRouteUDP for rtsp ports
        #    This allows rtsp to be accessed via traefik rather than directly
      - name: rtsp0
        args:
        - -p
        - "8085"
        - -u
        - ""
        - -fH264
        - -W 1280
        - -H 720
        - -F 30
        - -S60
        # Audio plus video capture on raspberry pi's overloads usb bandwidth causing one to fail, and the other to be served
        # - -A
        # - "48000"
        # - -C
        # - "1"
        # - -a
        # - S16_LE
        - "/dev/video30"
