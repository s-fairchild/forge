---
##### volumeMounts Start #####
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: renderd128
    mountPath: /dev/dri/renderd128

- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: card1
    mountPath: /dev/dri/card1

- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: motion-conf-tmp
    mountPath: /tmp/.motion

##### volumeMounts Start #####

##### volumes Start #####
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: renderd128
    hostPath:
      path: /dev/dri/renderD128
      type: CharDevice

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: card1
    hostPath:
      path: /dev/dri/card1
      type: CharDevice

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: motion-conf-tmp
    emptyDir:
      sizeLimit: 0.5Mi
      medium: Memory

##### volumes End #####
