---
resources:
  - ../../base

# TODO find the correct patch operation to append database.conf into motion.conf (base)
patches:
  - path: deployment.yaml
  - path: pvc/media-pvc.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: camera1-conf-cm
    namespace: motion
    behavior: create
    files:
      - configmap/camera1.conf
  
  - name: motion-conf-cm
    namespace: motion
    # merge will also replace the motion.conf key.
    # This is due to merge only working to merge configmap keys, not the data within the key.
    behavior: merge
    files:
      - configmap/motion.conf
