---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-web-cert
  namespace: jellyfin
spec:
  commonName: jellyfin.jellyfin.svc.cluster.local

  dnsNames:
  - jellyfin.jellyfin.svc.cluster.local
  - jellyfin.jellyfin.svc
  - jellyfin.jellyfin
  - jellyfin

  - '*.jellyfin.jellyfin.svc.cluster.local'
  - '*.jellyfin.jellyfin.svc'
  - '*.jellyfin.jellyfin'

  - localhost

  issuerRef:
    name: root-ca
    kind: ClusterIssuer
    group: cert-manager.io

  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 256

  secretName: jellyfin-web-cert
  secretTemplate:
    labels:
      app.kubernetes.io/part-of: jellyfin

  usages:
    - "digital signature"
    - "key agreement"
