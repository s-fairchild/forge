# https://motion-project.github.io/motion_config.html#OptDetail_Database
#

database_type mariadb

database_dbname security

database_host mariadb-operator-webhook.mariadb-operator.svc.cluster.local

database_port 443

database_user motion

# TODO Create this in a separate config file that is not stored in git
# database_password 

# Log to the database when Motion triggers an image file to be saved.
sql_log_picture true

# Log to the database when creating a motion triggered movie file.
sql_log_movie true

# Log to the database when creating a timelapse movie file.
sql_log_timelapse true

# INSERT statements. Conversion specifiers can be used.
#   * https://motion-project.github.io/motion_config.html#conversion_specifiers
# 
# SQL statement (typically INSERT) executed when a motion event is recognized. This can be used, for example, to record event start times and generate unique event IDs. 
sql_query_start INSERT INTO security(camera, filename, frame, file_type, time_stamp, text_event) VALUES(%t, '%f', %q, %n, '%Y-%m-%d %T', '%C')

# You can use Conversion Specifiers in this statement. File type (conversion specifier %n) allows distinction between motion movie end and timelapse movie end. 
sql_query_stop UPDATE security SET movie_end='%Y-%m-%d %T' WHERE filename='%f'
