---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webhook-certificate
  namespace: mariadb-operator
spec:
  secretName: webhook-certificate
  dnsNames:
    - "mariadb-operator.app.rick.expresso.lan"
  issuerRef:
    name: my-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
