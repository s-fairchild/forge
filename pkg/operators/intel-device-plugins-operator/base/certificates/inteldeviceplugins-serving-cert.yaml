---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: inteldeviceplugins-serving-cert
  namespace: intel-device-plugins-operator
spec:
  dnsNames:
  - inteldeviceplugins-webhook-service
  - inteldeviceplugins-webhook-service.intel-device-plugins-operator
  - inteldeviceplugins-webhook-service.intel-device-plugins-operator.svc

  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: root-ca

  secretName: webhook-server-cert
