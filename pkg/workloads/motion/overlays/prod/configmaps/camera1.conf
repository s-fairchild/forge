# netcam_params proxy=http://tcp.rtsp0.app:8555,input_format=h264,rtsp_transport=tcp,capture_rate=20,decoder=qsv
# netcam_params capture_rate=20,decoder=qsv
# netcam_params proxy=http://tcp.rtsp0.app:8555,capture_rate=20,decoder=qsv
# netcam_params capture_rate=20,decoder=h264
netcam_params capture_rate=15,decoder=h264_qsv

# Image width in pixels.
width 1280

# Image height in pixels.
height 720

framerate 15
