[Unit]
Upholds=k3s-server@1.service
Upholds=k3s-server@2.service
Before=k3s-server@1.service
Before=k3s-server@2.service

[Service]
Environment=NODE_IP="10.10.0.1"
Environment=NODE_IP_AGENT="10.11.0.1"
Environment=NODE_EXTERNAL_IP="10.50.0.2"

[Container]
# Network=kube-server.network:ip=${NODE_IP}
# Network=kube-agent.network:ip=${NODE_IP_AGENT}

Network=k3s@server.network:ip=${NODE_IP}
Network=kube@agent.network:ip=${NODE_IP_AGENT}
# TODO Enable publishing port if troubleshooting is needed for using the external network for external apiserver access
# PublishPort=${NODE_EXTERNAL_IP}:6443:6443
Network=k3s@external.network:ip=${NODE_EXTERNAL_IP}
