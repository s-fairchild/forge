---
resources:
  - helmcharts/cloudnative-pg.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: cloudnative-pg-values
    namespace: kube-system
    files:
      - values/config.yaml
      - values/monitoring.yaml
      - values/resources.yaml
      - values/security.yaml
      - values/service.yaml

# https://github.com/kubernetes-sigs/kustomize/issues/815#issuecomment-722675365
crds:
  - crds/helmcharts-cattle-openapi-spec.yaml
