# References:
#  * https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/
#  * https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/
#  * https://intel.github.io/intel-device-plugins-for-kubernetes/cmd/gpu_plugin/README.html
---
resources:
  - helmcharts/device-plugins-gpu.yaml
  - namespace.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
- name: intel-device-plugins-gpu-values
  namespace: kube-system
  files:
    - values/values.yaml

# https://github.com/kubernetes-sigs/kustomize/issues/815#issuecomment-722675365
crds:
  - crds/helmcharts-cattle-openapi-spec.yaml
