---
kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
  - helmcharts/node-feature-discovery.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: node-feature-discovery-values
    namespace: kube-system
    files:
      - values/values.yaml

# https://github.com/kubernetes-sigs/kustomize/issues/815#issuecomment-722675365
crds:
  - crds/helmcharts-cattle-openapi-spec.yaml
