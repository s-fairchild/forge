# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/tags/v39.0.2/traefik/values.schema.json
#
# Documentation:
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/values.yaml
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/VALUES.md
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/README.md
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/EXAMPLES.md
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/Guidelines.md
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/Changelog.md
#   * https://doc.traefik.io/traefik-hub/api-gateway/reference/install/ref-helm

deployment:
  podAnnotations:
    prometheus.io/port: "8082"
    prometheus.io/scrape: "true"

image:
  registry: docker.io
  repository: "rancher/mirrored-library-traefik"
  tag: "3.6.9"
  pullPolicy: IfNotPresent

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    allowExternalNameServices: true
    allowEmptyServices: true

  kubernetesIngress:
    enabled: false

nodeSelector:
  svccontroller.k3s.cattle.io/enablelb: "true"

tolerations:
- key: "CriticalAddonsOnly"
  operator: "Exists"
- key: "node-role.kubernetes.io/control-plane"
  operator: "Exists"
  effect: "NoSchedule"
- key: "node-role.kubernetes.io/master"
  operator: "Exists"
  effect: "NoSchedule"

priorityClassName: "system-cluster-critical"

hostNetwork: false

rbac:
  enabled: true
  namespaced: false

serviceAccount:
  name: ""

tlsStore:
  default:
    defaultCertificate:
      secretName: default-certificate

logs:
  general:
    level: INFO
  access:
    enabled: true
    addInternals: false
    fields:
      headers:
        defaultmode: keep
