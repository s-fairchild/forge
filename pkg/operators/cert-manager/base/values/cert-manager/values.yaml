# yaml-language-server: $schema=https://raw.githubusercontent.com/cert-manager/cert-manager/refs/tags/v1.19.4/deploy/charts/cert-manager/values.schema.json
#
# https://github.com/cert-manager/trust-manager/blob/main/deploy/charts/trust-manager/values.yaml

global:
  imagePullSecrets: []

  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"

  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: "CriticalAddonsOnly"
      operator: "Exists"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

  commonLabels: {}
  priorityClassName: ""

  rbac:
    create: true
    aggregateClusterRoles: true

  podSecurityPolicy:
    enabled: false
    useAppArmor: true

  logLevel: 2

  leaderElection:
    namespace: "kube-system"

installCRDs: false
crds:
  enabled: true
  keep: true

featureGates: ""

maxConcurrentChallenges: 60

# yaml-language-server-disable Property imageRegistry is not allowed
imageRegistry: quay.io
# yaml-language-server-disable Property imageNamespace is not allowed
imageNamespace: jetstack

image:
  # yaml-language-server-disable Property name is not allowed
  name: cert-manager-controller
  pullPolicy: IfNotPresent

clusterResourceNamespace: ""

namespace: ""

serviceAccount:
  create: true
  automountServiceAccountToken: true

enableCertificateOwnerRef: true

config: {}

dns01RecursiveNameservers: ""
dns01RecursiveNameserversOnly: false

disableAutoApproval: false

approveSignerNames:
- issuers.cert-manager.io/*
- clusterissuers.cert-manager.io/*

extraArgs: []
extraEnv: []
resources: {}

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

volumes: []
volumeMounts: []
podLabels: {}
hostAliases: []

# yaml-language-server-disable Property networkPolicy is not allowed
networkPolicy:
  enabled: false

  ingress:
  - ports:
    - port: http-metrics
      protocol: TCP
    - port: http-healthz
      protocol: TCP


  egress:
  - ports:
    - port: 80
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
    - port: 6443
      protocol: TCP

ingressShim: {}

#
tolerations: []

#
topologySpreadConstraints: []

#
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 15
  successThreshold: 1
  failureThreshold: 8

enableServiceLinks: false

prometheus:
  enabled: false

  servicemonitor:
    enabled: false
    labels: {}
    annotations: {}
    prometheusInstance: default
    targetPort: http-metrics
    path: /metrics
    interval: 60s
    scrapeTimeout: 30s
    honorLabels: false
    endpointAdditionalProperties: {}

  podmonitor:
    # Note that you cannot enable both PodMonitor and ServiceMonitor as they are
    # mutually exclusive. Enabling both will result in an error.
    enabled: false
    labels: {}
    annotations: {}
    prometheusInstance: default
    path: /metrics
    interval: 60s
    scrapeTimeout: 30s
    honorLabels: false
    endpointAdditionalProperties: {}

webhook:
  replicaCount: 1
  timeoutSeconds: 30
  config: {}

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  validatingWebhookConfiguration:
    namespaceSelector:
      matchExpressions:
        - key: "cert-manager.io/disable-validation"
          operator: "NotIn"
          values:
            - "true"

  mutatingWebhookConfiguration:
    namespaceSelector: {}

  extraArgs: []
  extraEnv: []
  featureGates: ""
  resources: {}

  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 60
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1

  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 5
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 1

  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"

  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: "CriticalAddonsOnly"
      operator: "Exists"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

  topologySpreadConstraints: []
  podLabels: {}
  serviceLabels: {}
  serviceIPFamilyPolicy: ""
  serviceIPFamilies: []

  image:
    # yaml-language-server-disable Property name is not allowed
    name: cert-manager-webhook
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    automountServiceAccountToken: true

  securePort: 10250
  hostNetwork: false
  serviceType: ClusterIP
  url: {}

  networkPolicy:
    enabled: true

    ingress:
    - ports:
      - port: https
        protocol: TCP
      - port: healthcheck
        protocol: TCP
      - port: http-metrics
        protocol: TCP

    egress:
    - ports:
      - port: 80
        protocol: TCP
      - port: 443
        protocol: TCP
      - port: 53
        protocol: TCP
      - port: 53
        protocol: UDP
      - port: 6443
        protocol: TCP

  volumes: []
  volumeMounts: []

  enableServiceLinks: false
  # yaml-language-server-disable Property enableClientVerification is not allowed
  enableClientVerification: false
  # yaml-language-server-disable Property clientCAFile is not allowed
  clientCAFile: ""
  # yaml-language-server-disable Property apiserverClientCertSubjects is not allowed
  apiserverClientCertSubjects: ""

cainjector:
  enabled: true
  config: {}

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  # yaml-language-server-disable Property networkPolicy is not allowed
  networkPolicy:
    enabled: true

    ingress:
    - ports:
      - port: http-metrics
        protocol: TCP

    egress:
    - ports:
      - port: 80
        protocol: TCP
      - port: 443
        protocol: TCP
      - port: 53
        protocol: TCP
      - port: 53
        protocol: UDP
      - port: 6443
        protocol: TCP

  extraArgs: []
  extraEnv: []
  featureGates: ""
  resources: {}

  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"

  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: "CriticalAddonsOnly"
      operator: "Exists"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

  topologySpreadConstraints: []
  podLabels: {}
  serviceLabels: {}

  image:
    # yaml-language-server-disable Property name is not allowed
    name: cert-manager-cainjector
    repository: ""
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    automountServiceAccountToken: true

  volumes: []
  volumeMounts: []
  enableServiceLinks: false

startupapicheck:
  enabled: true

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  timeout: 1m
  backoffLimit: 4

  jobAnnotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

  extraArgs:
  - -v

  extraEnv: []
  resources: {}
  podLabels: {}

  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"

  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: "CriticalAddonsOnly"
      operator: "Exists"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

  image:
    # yaml-language-server-disable Property name is not allowed
    name: cert-manager-startupapicheck
    repository: ""
    pullPolicy: IfNotPresent

  rbac:
    annotations:
      helm.sh/hook: post-install
      helm.sh/hook-weight: "-5"
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

  serviceAccount:
    create: true
    automountServiceAccountToken: true

    annotations:
      helm.sh/hook: post-install
      helm.sh/hook-weight: "-5"
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

  volumes: []
  volumeMounts: []
  enableServiceLinks: false

extraObjects: []

creator: "helm"

enabled: true
