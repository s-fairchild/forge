---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- bundles/root-ca-bundle.yaml

patches:
  - path: certificates/root-ca-patch.yaml
    target:
      version: v1
      group: cert-manager.io
      kind: Certificate
      name: root-ca
      namespace: cert-manager

  - path: helmcharts/cert-manager-patch.yaml
    target:
      version: v1
      group: helm.cattle.io
      kind: HelmChart
      name: cert-manager
      namespace: kube-system

  - path: helmcharts/trust-manager-patch.yaml
    target:
      version: v1
      group: helm.cattle.io
      kind: HelmChart
      name: trust-manager
      namespace: kube-system

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: cert-manager-values
    namespace: kube-system
    behavior: merge
    files:
    - prod-values.yaml=values/cert-manager/values.yaml

  - name: trust-manager-values
    namespace: kube-system
    behavior: merge
    files:
    - values/trust-manager/crds-values.yaml
    - values/trust-manager/secret-targets-values.yaml
    - values/trust-manager/app-values.yaml
