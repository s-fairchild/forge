---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
- path: namespace-patch.yaml
  target:
    version: v1
    kind: Namespace
    name: mariadb

- path: helmcharts/mariadb-cluster-patch.yaml
  target:
    version: v1
    group: helm.cattle.io
    kind: HelmChart
    name: mariadb-cluster
    namespace: kube-system

secretGenerator:
- name: mariadb-cluster-values
  namespace: kube-system
  behavior: merge
  files:
    - prod-values.yaml=values/values.yaml
