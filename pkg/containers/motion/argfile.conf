# motion-package build-arg defaults.
# These should be overridden in hack/env/podman/build/motion-package.env
#
# Values should not be wrapped in quotes. This breaks things due to how builda expands args.
# Reference: https://github.com/containers/buildah/issues/5945
#

# Motion packages are named using the distribution name, not version.
# Using the release name here to match the motion package installed.
# https://hub.docker.com/_/ubuntu
#
IMAGE_REGISTRY=docker.io
IMAGE_REPOSITORY=library/ubuntu
IMAGE_TAG=noble

# https://github.com/Motion-Project/motion/releases/tag/release-4.7.1
MOTION_VERSION_TAG=4.7.1

TZ_COUNTRY=Etc
TZ_CITY=GMT
