---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rtsp0-ir-tcp
  namespace: motion
spec:
  entryPoints:
  - rtsp-tcp

  routes:
  - match: HostSNI(`rtsp0.v4l2rtspserver.svc`)
    priority: 10

    services:
    - name: rtsp0-svc
      namespace: v4l2rtspserver
      port: rtsp-tcp
      weight: 10
      # See note: https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/crd/tcp/serverstransporttcp/
      serversTransport: v4l2rtspserver-rtsp0-transport@kubernetescrd
      nativeLB: true
      # nodePortLB: true

  tls:
    secretName: motion-client-cert
