---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: helmcharts/traefik-patch.yaml
    target:
      kind: HelmChart
      name: traefik
      namespace: kube-system

  - path: certificates/default-certificate-patch.yaml
    target:
      kind: Certificate
      version: v1
      group: cert-manager.io
      name: default-certificate
      namespace: traefik-system

secretGenerator:
  - name: traefik-custom-values
    namespace: kube-system
    behavior: merge
    files:
    - prod-values.yaml=values/values.yaml
