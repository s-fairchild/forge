---
resources:
- ../../base

patches:
  - path: deployment.yaml

  - path: ingress-routes/rtsp-hls-ir-patch.yaml
    target:
      version: v1alpha1
      group: traefik.io
      kind: IngressRoute
      name: rtsp-hls-ingressroute
      namespace: v4l2rtspserver

secretGenerator:
- name: rtsp0-password
  namespace: v4l2rtspserver
  files:
  - rtsp0.password.txt
  options:
    disableNameSuffixHash: true
