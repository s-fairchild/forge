---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: motion-webcontrol-server-cert
  namespace: motion
spec:
  commonName: webcontrol.motion.svc.cluster.local

  dnsNames:
  - webcontrol.motion.svc.cluster.local
  - webcontrol.motion.svc
  - webcontrol.motion
  - webcontrol

  - '*.webcontrol.motion.svc.cluster.local'
  - '*.webcontrol.motion.svc'
  - '*.webcontrol.motion'
  - '*.webcontrol'

  - localhost

  issuerRef:
    name: root-ca
    kind: ClusterIssuer
    group: cert-manager.io

  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 256

  secretName: motion-webcontrol-server-cert

  usages:
  - digital signature
  - key agreement
  - key encipherment
  - server auth
