---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: helmcharts/mariadb-operator-patch.yaml
    target:
      kind: HelmChart
      name: mariadb-operator
      namespace: kube-system
      version: v1
      group: helm.cattle.io

secretGenerator:
  - name: mariadb-operator-values
    namespace: kube-system
    behavior: merge
    files:
    - prod-values.yaml=values/values.yaml
