---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: default-certificate
  namespace: traefik-system

spec:
  commonName: traefik.traefik-system.svc.cluster.local

  secretName: default-certificate

  dnsNames:
  - traefik.traefik-system.svc
  - traefik.traefik-system
  - traefik

  - traefik-internal.traefik-system.svc.cluster.local
  - traefik-internal.traefik-system.svc
  - traefik-internal

  - '*.traefik.traefik-system.svc'
  - '*.traefik.traefik-system'
  - '*.traefik'

  - '*.traefik-internal.traefik-system.svc.cluster.local'
  - '*.traefik-internal.traefik-system.svc'
  - '*.traefik-internal'

  duration: 8760h # 1 year

  issuerRef:
    name: root-ca
    kind: ClusterIssuer
    group: cert-manager.io
