---
# References:
#   * https://github.com/kube-vip/helm-charts/releases/tag/kube-vip-0.9.9
#   * https://github.com/kube-vip/helm-charts/blob/kube-vip-0.9.9/charts/kube-vip/values.yaml
#
# Values derived from running kube-vip manifest daemonset on a server node
#   Command used: podman -r \
#                        run \
#                        --network=kube-server \
#                        --network=kube-agent \
#                        --network=kube-service \
#                        --rm \
#                        ghcr.io/kube-vip/kube-vip:v1.2.0 \
#                            manifest \
#                            daemonset \
#                            --inCluster \
#                            --taint \
#                            --controlplane \
#                            --arp \
#                            --leaderElection \
#                            --interface \
#                            server0 \
#                            --address 10.43.0.1

# https://kube-vip.io/docs/installation/flags/#flags
#
# I believe only address works here.
# Everything else must be set via environment variables.
config:
  address: 10.100.0.100

# https://kube-vip.io/docs/installation/flags/#environment-variables
env:
  address: 10.100.0.100
  # TODO test enabling services in staging
  # Determine if this is preferred over configuring metallb
  # svc_enable: "false"
  # svc_election: "false"
