# rpicam-apps Build Args
# Values should not be wrapped in quotes. This breaks things due to how builda expands args.
# Reference: https://github.com/containers/buildah/issues/5945

### Build container image URI ###
IMAGE_REGISTRY=docker.io
IMAGE_REPOSITORY=library/debian
IMAGE_TAG=trixie-slim

# Build and install directory prefix passed to meson
PREFIX=/usr/local

# https://github.com/raspberrypi/rpicam-apps/tree/main
RPICAM_APPS_VERSION=main

# rpicam-apps Meson build args
# https://www.raspberrypi.com/documentation/computers/camera_software.html#rpicam-apps-meson-flag-reference
#
# Use -Dneon_flags=armv8-neon to enable optimizations for 32-bit OSes on Raspberry Pi 3 or Raspberry Pi 4.
NEON_FLAGS=arm64
# Recommended for headless setup
ENABLE_DRM=enabled
# Required for hardware encode/decode
ENABLE_LIBAV=enabled
ENABLE_HAILO=disabled
ENABLE_EGL=disabled
ENABLE_QT=disabled
ENABLE_OPENCV=disabled
ENABLE_TFLITE=disabled
DOWNLOAD_HAILO_MODELS=false
