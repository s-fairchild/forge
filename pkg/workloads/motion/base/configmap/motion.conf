;#* This config file was generated by motion 5.0.0-git-20250204-cfc9246
;#* Documentation:  /usr/local/share/doc/motion/motion_guide.html
;
;#* This file contains only the basic configuration options to get a
;#* system working.  There are many more options available.  Please
;#* consult the documentation for the complete list of all options.
;#*

;#*************************************************
;#*****   System
;#*************************************************
daemon off
setup_mode ${SYSTEM_SETUP_MODE:-off}
;log_file
;# Values: 1 - 9 | Default: 6
;#   * Verbosity level(EMR, ALR, CRT, ERR, WRN, NTC, INF, DBG, ALL) of messages. 
log_level ${SYSTEM_LOG_LEVEL:-6}
;#   * Values: COR, STR, ENC, NET, DBL, EVT, TRK, VID, ALL | Default: ALL
log_type ${SYSTEM_LOG_TYPE:-ALL}
target_dir ${SYSTEM_TARGET_DIR:-.}
config_dir ${SYSTEM_CONFIG_DIR:-}

;#*************************************************
;#*****   Camera
;#*************************************************
; device_name
; device_id

;#*************************************************
;#*****   Source
;#*************************************************
;v4l2_device /dev/video0
;netcam_url

;#*************************************************
;#*****   Image Processing
;#*************************************************
width ${IMAGE_WIDTH:-640}
height ${IMAGE_HEIGHT:-480}
framerate ${IMAGE_FRAMERATE:-15}

;#*************************************************
;#*****   Overlays
;#*************************************************
text_left ${IMAGE_TEXT_LEFT:-}
text_right ${IMAGE_TEXT_RIGHT:-}
text_scale ${IMAGE_TEXT_SCALE:-1}
text_event ${IMAGE_TEXT_EVENT:-%Y%m%d%H%M%S}
locate_motion_style ${IMAGE_LOCATE_MOTION_STYLE:-box}
locate_motion_mode ${IMAGE_LOCATE_MOTION_MODE:-off}

;#*************************************************
;#*****   Method
;#*************************************************
emulate_motion off
threshold 1500

;#*************************************************
;#*****   Masks
;#*************************************************
noise_level 32
despeckle_filter EedDl

;#*************************************************
;#*****   Detection
;#*************************************************
minimum_motion_frames 1
event_gap 60
pre_capture 3
post_capture 10

;#*************************************************
;#*****   Scripts
;#*************************************************
on_event_start
on_event_end

;#*************************************************
;#*****   Picture
;#*************************************************
picture_output off
picture_filename %t-%v-%Y%m%d%H%M%S-%q

;#*************************************************
;#*****   Movie
;#*************************************************
movie_output ${MOVIE_OUTPUT:-on}
movie_max_time ${MOVIE_MAX_TIME:-120}
movie_quality ${MOVIE_QUALITY:-60}
movie_container ${MOVIE_CONTAINER:-mkv}
movie_filename ${MOVIE_FILENAME:-%v-%Y%m%d%H%M%S}
movie_retain ${MOVIE_RETAIN:-off}
movie_passthrough ${MOVIE_PASSTHROUGH:-off}
movie_extpipe_use ${MOVIE_EXTPIPE_USE:-off}
timelapse_interval ${MOVIE_TIMELAPSE_INTERVAL:-0}
timelapse_mode ${MOVIE_TIMELAPSE_MODE:-daily}
timelapse_fps ${MOVIE_TIMELAPSE_FPS:-30}
timelapse_filename ${MOVIE_TIMELAPSE_FILENAME:-%Y%m%d-timelapse}

;#*************************************************
;#*****   Web Control
;#*************************************************
;#  * not all motion deployments will require web server running
;#* http
webcontrol_port ${WEBCONTROL_PORT:-80}
webcontrol_localhost ${WEBCONTROL_LOCALHOST:-on}

webcontrol_auth_method ${WEBCONTROL_AUTH_METHOD:-none}
webcontrol_authentication ${WEBCONTROL_AUTHENTICATION_USER}:${WEBCONTROL_AUTHENTICATION_PASSWORD}

;# TODO Determine if I should set all remaining unused actions=off
webcontrol_actions movies=${WEBCONTROL_ACTIONS_MOVIES:-off},restart=${WEBCONTROL_ACTIONS_RESTART:-off},snapshot=${WEBCONTROL_ACTIONS_SNAPSHOT:-on},config=${WEBCONTROL_ACTIONS_CONFIG:-off},ptz=${WEBCONTROL_ACTIONS_PTZ:-off}
webcontrol_parms ${WEBCONTROL_PARMS:-0}

webcontrol_lock_attempt ${WEBCONTROL_LOCK_ATTEMPT:-5}
webcontrol_lock_minutes ${WEBCONTROL_LOCK_MINUTES:-10}
; webcontrol_lock_script

;#*************************************************
;#*****   Live Stream
;#*************************************************
stream_preview_scale ${STREAM_PREVIEW_SCALE:-25}
stream_preview_method ${STREAM_PREVIEW_METHOD:-mjpg}
stream_preview_ptz ${STREAM_PREVIEW_PTZ:-on}
stream_quality ${STREAM_QUALITY:-50}
stream_maxrate ${STREAM_MAXRATE:-1}
stream_motion ${STREAM_MOTION:-off}
stream_scan_time ${STREAM_SCAN_TIME:-5}
stream_scan_scale ${STREAM_SCAN_SCALE:-25}

;#*************************************************
;#*****   Database
;#*************************************************
database_type ${DATABASE_TYPE}
database_dbname ${DATABASE_DBNAME}
database_host ${DATABASE_HOST}
database_port ${DATABASE_PORT}
database_user ${DATABASE_USER}
database_password ${DATABASE_PASSWORD}

sql_event_start ${SQL_EVENT_START}
sql_event_end ${SQL_EVENT_END}
# TODO create sql for these events
; sql_movie_start ${SQL_MOVIE_START:-}
; sql_movie_end ${SQL_MOVIE_END:-}
; sql_pic_save ${SQL_PIC_SAVE:-}

;#*************************************************
;#*****   Sound
;#*************************************************
;#   * OR ideally create sound config drop ins for each overlays
; snd_device
; snd_params
; snd_alerts
; snd_window
; snd_show

;#*************************************************
;#*** Device config files - One for each device.
;#*************************************************
; camera /usr/local/var/lib/motion/camera1.conf
; camera /usr/local/var/lib/motion/camera2.conf
; camera /usr/local/var/lib/motion/camera3.conf
; sound /usr/local/var/lib/motion/sound1.conf

;#*************************************************
;#*** Directory to read '.conf' files for devices.
;#*************************************************
config_dir /usr/local/var/lib/motion/conf.d
