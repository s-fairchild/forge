# k3s@svclb.yaml
#
# https://docs.k3s.io/installation/configuration#configuration-file
# https://docs.k3s.io/cli/agent#node
---
node-label:
  - "node-role.kubernetes.io/agent=true"

# This taint is in preparation for scheduling metallb addresspools to run exclusively on this node.
# No other workloads should be scheduled.
node-taint:
  - "metallb=true:NoSchedule"
