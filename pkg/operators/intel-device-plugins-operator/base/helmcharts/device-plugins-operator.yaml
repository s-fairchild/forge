---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: intel-device-plugins-operator
  namespace: kube-system
spec:
  # https://github.com/intel/helm-charts/blob/main/charts/device-plugin-operator/Chart.yaml
  # chart: https://%{KUBERNETES_API}%/static/charts/intel-device-plugins-operator-0.35.0.tgz
  chart: intel-device-plugins-operator
  repo: https://intel.github.io/helm-charts
  version: 0.35.0

  targetNamespace: intel-device-plugins-operator
  takeOwnership: true
  failurePolicy: reinstall

  valuesSecrets:
  - name: intel-device-plugins-operator-values
    ignoreUpdates: false
    keys:
      - values.yaml

  set:
    global.systemDefaultRegistry: ""
