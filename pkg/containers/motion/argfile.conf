# Motion Build Args
# Values should not be wrapped in quotes. This breaks things due to how builda expands args.
# Reference: https://github.com/containers/buildah/issues/5945

### Build container image URI ###
IMAGE_REGISTRY=docker.io
IMAGE_REPOSITORY=library/debian
IMAGE_TAG=trixie-slim

FFMPEG="ffmpeg"

# Tooling options
BUILD_THREADS=1
PREFIX=/usr/local
PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig

# https://github.com/Motion-Project/motion/tree/master
MOTION_VERSION=master

# Excluded options
#
# https://motion-project.github.io/motion_build.html#Configure_Script
MAKE_OPTIONS_EXCLUDE=--without-mysql --without-mariadb --without-pgsql --without-v4l2

MAKE_FLAGS=-lavformat -lswscale -lavcodec -lavutil -lfdk-aac -lswresample -lm -lopus -lz -lva -lvpx -lx264 -lmp3lame -lbz2 -ldl -lvorbisenc -lvorbis -ltheoraenc -ltheoradec
