# Documentation:
#   * /usr/share/doc/motion/motion_guide.html

###########################################################
# Configuration options specific to camera 1
############################################################

# User defined name for the camera.
device_name RTSP0

# Numeric identifier for the camera.
device_id 1

# The full URL of the network camera stream.
# rtsp://<port-name>.<protocol>.<service-name>.<namespace>.svc.<cluster-domain.example>
# TODO troubleshoot this connection, the servertransporttcp, ang ingressroute
# netcam_url rtsp://tcp.rtsp0.app:555
# netcam_url rtsp://tcp.rtsp0.app:8555
netcam_url rtsp://rtsp0-svc.v4l2rtspserver.svc.cluster.local:555

;# HW DECODERS
;# `ffmpeg -decoders|grep -i qsv` output
;# * V....D av1_qsv              AV1 video (Intel Quick Sync Video acceleration) (codec av1)
;# * V....D h264_qsv             H264 video (Intel Quick Sync Video acceleration) (codec h264)
;# * V....D hevc_qsv             HEVC video (Intel Quick Sync Video acceleration) (codec hevc)
;# * V....D mjpeg_qsv            MJPEG video (Intel Quick Sync Video acceleration) (codec mjpeg)
;# * V....D mpeg2_qsv            MPEG2VIDEO video (Intel Quick Sync Video acceleration) (codec mpeg2video)
;# * V....D vc1_qsv              VC1 video (Intel Quick Sync Video acceleration) (codec vc1)
;# * V....D vp8_qsv              VP8 video (Intel Quick Sync Video acceleration) (codec vp8)
;# * V....D vp9_qsv              VP9 video (Intel Quick Sync Video acceleration) (codec vp9)
;# HW ACCELERATORS
;# `ffmpeg -hwaccels` output
;# * Hardware acceleration methods:
;# * vdpau
;# * cuda
;# * vaapi
;# * qsv
;# * drm
;# * opencl
;# * vulkan
;# ENCODERS (QSV HW ACCELERATED)
;# `ffmpeg -codecs|grep -i qsv` output
;# * DEV.L. av1                  Alliance for Open Media AV1 (decoders: libdav1d libaom-av1 av1 av1_cuvid av1_qsv) (encoders: libaom-av1 librav1e libsvtav1 av1_nvenc av1_qsv av1_vaapi)
;# * DEV.LS h264                 H.264 / AVC / MPEG-4 AVC / MPEG-4 part 10 (decoders: h264 h264_v4l2m2m h264_qsv h264_cuvid) (encoders: libx264 libx264rgb h264_nvenc h264_qsv h264_v4l2m2m h264_vaapi)
;# * DEV.L. hevc                 H.265 / HEVC (High Efficiency Video Coding) (decoders: hevc hevc_qsv hevc_v4l2m2m hevc_cuvid) (encoders: libx265 hevc_nvenc hevc_qsv hevc_v4l2m2m hevc_vaapi)
;# * DEVIL. mjpeg                Motion JPEG (decoders: mjpeg mjpeg_cuvid mjpeg_qsv) (encoders: mjpeg mjpeg_qsv mjpeg_vaapi)
;# * DEV.L. mpeg2video           MPEG-2 video (decoders: mpeg2video mpegvideo mpeg2_v4l2m2m mpeg2_qsv mpeg2_cuvid) (encoders: mpeg2video mpeg2_qsv mpeg2_vaapi)
;# * D.V.L. vc1                  SMPTE VC-1 (decoders: vc1 vc1_qsv vc1_v4l2m2m vc1_cuvid)
;# * DEV.L. vp8                  On2 VP8 (decoders: vp8 vp8_v4l2m2m libvpx vp8_cuvid vp8_qsv) (encoders: libvpx vp8_v4l2m2m vp8_vaapi)
;# * DEV.L. vp9                  Google VP9 (decoders: vp9 vp9_v4l2m2m libvpx-vp9 vp9_cuvid vp9_qsv) (encoders: libvpx-vp9 vp9_vaapi vp9_qsv)

# netcam_params proxy=http://tcp.rtsp0.app:8555,input_format=h264,rtsp_transport=tcp,capture_rate=20,decoder=qsv
# netcam_params input_format=h264,rtsp_transport=tcp,capture_rate=20,decoder=qsv
# netcam_params input_format=h264,capture_rate=20,decoder=qsv
# netcam_params proxy=http://tcp.rtsp0.app:8555,capture_rate=20,decoder=qsv
# netcam_params capture_rate=20,decoder=qsv
netcam_params capture_rate=20

# Image width in pixels.
width 1280

# Image height in pixels.
height 720

framerate 15
