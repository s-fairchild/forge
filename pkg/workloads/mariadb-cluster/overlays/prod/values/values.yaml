---
# yaml-language-server: $schema=../../../../../schemas/mariadb-cluster/values.schema.json

# yaml-language-server-disable Missing property
mariadb:
  replicas: 1

  rootPasswordSecretKeyRef:
    name: "mariadb-root"
    key: root
    generate: false

  podDisruptionBudget:
    maxUnavailable: 33%

  # yaml-language-server-disable Missing property "size"
  storage:
    ephemeral: false
    resizeInUseVolumes: true
    waitForVolumeResize: true

    volumeClaimTemplate: 
      storageClassName: local-path-nvme
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

  affinity:
    # For now all should run on a single node
    # There is no real reason to run multiple agents containers on the same physical host
    antiAffinityEnabled: false

  tolerations:
    - key: "k8s.mariadb.com/node"
      operator: "Exists"
      effect: "NoSchedule"

  tls:
    enabled: true
    required: false

    serverCertIssuerRef:
      name: root-ca
      kind: ClusterIssuer

    clientCertIssuerRef:
      name: root-ca
      kind: ClusterIssuer
    
    serverCASecretRef:
      name: root-ca-bundle

    clientCASecretRef:
      name: root-ca-bundle

  metrics:
    exporter:
      affinity:
        # For now all should run on a single node
        # There is no real reason to run multiple agents containers on the same physical host
        antiAffinityEnabled: false

  # https://github.com/mariadb-operator/mariadb-operator/blob/main/docs/api_reference.md#galera
  galera:
    enabled: false
