# Documentation:
#   * /usr/share/doc/motion/motion_guide.html
#   * https://motion-project.github.io/4.6.0/motion_config.html

############################################################
# System control configuration parameters
############################################################

# Start in daemon (background) mode and release terminal.
daemon off

# Start in Setup-Mode, daemon disabled.
setup_mode off

# Level of log messages [1..9] (EMG, ALR, CRT, ERR, WRN, NTC, INF, DBG, ALL).
log_level 7

# Target directory for pictures, snapshots and movies
target_dir /var/motion

##############################################################
# Directory to read '.conf' files for cameras.
##############################################################
camera_dir /etc/motion/conf.d

############################################################
# Image Processing configuration parameters
############################################################

# Image width in pixels.
width 640

# Image height in pixels.
height 480

# Maximum number of frames to be captured per second.
# framerate 15

# Text to be overlayed in the lower left corner of images
# text_left CAMERA

# Text to be overlayed in the lower right corner of images.
text_right %Y-%m-%d\n%T-%q

############################################################
# Motion detection configuration parameters
############################################################

# Always save pictures and movies even if there was no motion.
emulate_motion off

# Threshold for number of changed pixels that triggers motion.
threshold 1500

# Noise threshold for the motion detection.
noise_level 32

# Despeckle the image using (E/e)rode or (D/d)ilate or (l)abel.
despeckle_filter EedDl

# Number of images that must contain motion to trigger an event.
minimum_motion_frames 1

# Gap in seconds of no motion detected that triggers the end of an event.
event_gap 60

# The number of pre-captured (buffered) pictures from before motion.
pre_capture 3

# Number of frames to capture after motion is no longer detected.
post_capture 5

############################################################
# Script execution configuration parameters
############################################################

# Command to be executed when an event starts.
; on_event_start value

# Command to be executed when an event ends.
; on_event_end value

# Command to be executed when a movie file is closed.
; on_movie_end value

############################################################
# Picture output configuration parameters
############################################################

# Output pictures when motion is detected.
picture_output off

# File name(without extension) for pictures relative to target directory.
picture_filename %Y%m%d%H%M%S-%q

# Use this option to specify the text to include in a JPEG EXIF comment The EXIF timestamp is included independent of this text.
# Write the same metadata as the filename.
picture_exif %Y%m%d%H%M%S-%q

############################################################
# Movie output configuration parameters
############################################################

# Create movies of motion events.
movie_output on

# Maximum length of movie in seconds.
movie_max_time 300

# The encoding quality of the movie. (0=use bitrate. 1=worst quality, 100=best)
movie_quality 100

# Container/Codec to used for the movie. See motion_guide.html
movie_codec mkv

# File name(without extension) for movies relative to target directory
movie_filename %t-%v-%Y%m%d%H%M%S

############################################################
# Webcontrol configuration parameters
############################################################

# Port number used for the webcontrol.
webcontrol_port 8080

# Restrict webcontrol connections to the localhost.
webcontrol_localhost on

# Type of configuration options to allow via the webcontrol.
webcontrol_parms 0

############################################################
# Live stream configuration parameters
############################################################

# The port number for the live stream.
stream_port 8081

# Restrict stream connections to the localhost.
stream_localhost false

# Be quiet, don't output beeps when detecting motion. Only works in non-daemon mode.
quiet true

# Locate and draw a box around the moving object. Value 'preview' makes Motion only draw a box on a saved preview jpeg image and not on the saved movie. 
locate_motion_mode preview


# https://motion-project.github.io/motion_config.html#OptDetail_Database
#

# TODO place this in an area where it can be read via drop in files from overlays.
# OR merge this into the cm from an overlay.
database_type  postgresql

database_dbname cnpg-cluster-motion

# TODO fix dns name
database_host cnpg-webhook-service.cnpg-cluster.svc.cluster.local

database_port 443

# TODO create motion service account and roles. It cannot access the database until this has been done.
database_user motion

# TODO Create this in a separate config file that is not stored in git
# database_password 

# Log to the database when Motion triggers an image file to be saved.
sql_log_picture true

# Log to the database when creating a motion triggered movie file.
sql_log_movie true

# Log to the database when creating a timelapse movie file.
sql_log_timelapse true

# INSERT statements. Conversion specifiers can be used.
#   * https://motion-project.github.io/motion_config.html#conversion_specifiers
# 
# SQL statement (typically INSERT) executed when a motion event is recognized. This can be used, for example, to record event start times and generate unique event IDs. 
sql_query_start INSERT INTO security(camera, filename, frame, file_type, time_stamp, text_event) VALUES(%t, '%f', %q, %n, '%Y-%m-%d %T', '%C')

# You can use Conversion Specifiers in this statement. File type (conversion specifier %n) allows distinction between motion movie end and timelapse movie end. 
sql_query_stop UPDATE security SET movie_end='%Y-%m-%d %T' WHERE filename='%f'
