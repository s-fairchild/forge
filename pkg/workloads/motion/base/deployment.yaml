---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: motion
  namespace: motion
  labels:
    app: motion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: motion
  template:
    metadata:
      name: motion
      namespace: motion
      labels:
        app: motion
    spec:
      restartPolicy: Always
      initContainers:
      - name: envsubst
        image: docker.io/steve51516/envsubst:ubi10-micro
        command: ["/bin/bash", "-c"]
        envFrom:
        - configMapRef:
            name: motion-webcontrol-conf

        args:
        # Variables are escaped with $$ to be passed as literal values rather than replaced on container start.
        # - "envsubst '$$DATABASE_TYPE $$DATABASE_DBNAME $$DATABASE_HOST $$DATABASE_PORT $$DATABASE_USER $$DATABASE_PASSWORD $$SQL_EVENT_START $$SQL_EVENT_END $$SQL_MOVIE_START $$SQL_MOVIE_END $$SQL_PIC_SAVE' < /root/.motion/motion.conf > /tmp/.motion/motion.conf"
        - "envsubst < /root/.motion/motion.conf > /tmp/.motion/motion.conf"

        volumeMounts:
        - name: motion-conf
          mountPath: /root/.motion
          readOnly: true

        - name: motion-conf-tmp
          mountPath: /tmp/.motion

      containers:
      - name: motion
        # Documentation:
        #   * https://motion-project.github.io/motionv5_config.html
        #   * https://motion-project.github.io/motionv5_build.html
        #   * https://motion-project.github.io/motionv5_examples.html
        #
        # Sources:
        #   * https://github.com/Motion-Project/motion/tree/5.0
        #   * https://hub.docker.com/repository/docker/steve51516/motion/tags
        image: docker.io/steve51516/motion:5.0
        imagePullPolicy: Always

        args:
        - -c
        - /tmp/.motion/motion.conf

        ports:
        - containerPort: 80
          name: webcontrol

        volumeMounts:
        - name: motion-conf
          # Optionally motion's config file could be re-read via sending a reload signal to the container.
          # to do this 'mountPropagation: Bidirectional' would be required.
          mountPropagation: HostToContainer
          mountPath: /root/.motion
          readOnly: true

        - name: motion-conf-d
          mountPath: /usr/local/var/lib/motion/conf.d
          readOnly: true
          recursiveReadOnly: IfPossible
          mountPropagation: None

        - name: motion-conf-tmp
          mountPath: /tmp/.motion
          readOnly: true

        - name: recordings
          mountPath: /var/motion
          mountPropagation: HostToContainer

        resources:
          requests:
            memory: "200Mi"
            cpu: "5m"
          limits:
            memory: "1Gi"
            cpu: "500m"

      volumes:
      - name: motion-conf
        configMap:
          name: motion-conf-cm
          optional: false

      - name: motion-conf-d
        configMap:
          name: motion-cameras-cm
          optional: true

      - name: motion-conf-tmp
        emptyDir:
          sizeLimit: 0.02Mi
          medium: Memory

      - name: recordings
        persistentVolumeClaim:
          claimName: recordings-pvc
