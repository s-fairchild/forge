---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: motion
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
    namespace: mariadb

  database: motion
  username: motion
  host: "%"
  cleanupPolicy: Delete
  retryInterval: 5s
  grantOption: true

  privileges:
  - CREATE
  - INSERT
  - UPDATE
  - ALTER
  - SELECT
