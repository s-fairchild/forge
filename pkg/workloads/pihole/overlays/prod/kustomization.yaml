---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: configmaps/custom-local-records.yaml
  - path: configmaps/pihole-cname-records.yaml

secretGenerator:
  - name: web-portal-auth
    namespace: pihole
    behavior: replace
    envs:
      - secrets/web-portal-auth.env
    options:
      disableNameSuffixHash: true
