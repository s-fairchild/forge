# https://docs.k3s.io/datastore/cluster-loadbalancer?ext-load-balancer=Nginx
#
# TODO replace with Kube-VIP
# https://docs.k3s.io/datastore/cluster-loadbalancer?ext-load-balancer=Kube-VIP

events {}

stream {
  upstream k3s_servers {
    server 10.10.0.2:6443;
    server 10.10.0.3:6443;
    server 10.10.0.4:6443;
  }

  server {
    listen 6443;
    proxy_pass k3s_servers;
  }
}
