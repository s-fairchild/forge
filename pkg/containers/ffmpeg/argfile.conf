# FFmpeg build args
# Values should not be wrapped in quotes. This breaks things due to how builda expands args.
# Reference: https://github.com/containers/buildah/issues/5945

# Build container options
IMAGE_REGISTRY=docker.io
IMAGE_REPOSITORY=library/ubuntu
IMAGE_TAG=24.04

# https://catalog.redhat.com/en/software/containers/ubi8/ubi-minimal/5c359a62bed8bd75a2c3fba8
# RELEASE_IMAGE_REGISTRY=registry.access.redhat.com
# RELEASE_IMAGE=ubi9
# RELEASE_IMAGE_TAG=ubi-minimal

# Tooling options
BUILD_THREADS=1
PREFIX=/usr/local

# General configure options
CONFIGURE_GENERAL=--enable-shared --enable-pthreads --enable-runtime-cpudetect
# configure --env=""
CONFIGURE_ENV=--env="LIBVA_DRIVER_NAME=iHD"
# configure licensing options
CONFIGURE_LICENSE=--enable-gpl --enable-version3 --enable-nonfree

# Excluded options
MAKE_EXCLUDE=--disable-x86asm  --disable-doc
# Intel GPU options
MAKE_HWACCELS=--enable-libvpx  --enable-libmfx --enable-opencl --enable-vulkan
MAKE_EXTERNAL_LIBRARIES=--enable-vaapi --enable-libx264 --enable-libx265 --enable-libwebp --enable-postproc --enable-libxml2 --enable-libxvid --enable-libzimg --enable-libzvbi --enable-gray --enable-libtwolame

# https://github.com/FFmpeg/FFmpeg/tree/master
FFMPEG_VERSION=master
