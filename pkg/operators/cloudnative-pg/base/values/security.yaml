---
#
# yaml-language-server: https://raw.githubusercontent.com/cloudnative-pg/charts/refs/tags/cloudnative-pg-v0.27.1/charts/cloudnative-pg/values.schema.json
#
# References:
#   * https://github.com/cloudnative-pg/charts/blob/cloudnative-pg-v0.27.1/charts/cloudnative-pg/values.yaml
#   * https://github.com/cloudnative-pg/charts/blob/cloudnative-pg-v0.27.1/charts/cloudnative-pg/Chart.yaml
#   * https://github.com/cloudnative-pg/charts/blob/cloudnative-pg-v0.27.1/charts/cloudnative-pg/README.md
#

serviceAccount:
  # -- Specifies whether the service account should be created.
  create: true
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

rbac:
  # -- Specifies whether ClusterRole and ClusterRoleBinding should be created.
  create: true
  # -- Aggregate ClusterRoles to Kubernetes default user-facing roles.
  # Ref: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#user-facing-roles
  aggregateClusterRoles: false

# -- Container Security Context.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - "ALL"

# -- Security Context for the whole pod.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  # fsGroup: 2000
