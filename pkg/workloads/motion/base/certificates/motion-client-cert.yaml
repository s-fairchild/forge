---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: motion-client-cert
  namespace: motion
spec:
  commonName: motion-client

  dnsNames:
  - motion-client

  issuerRef:
    name: root-ca
    kind: ClusterIssuer
    group: cert-manager.io

  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 256

  secretName: motion-client-cert

  usages:
  - digital signature
  - key agreement
  - client auth
