[Unit]
# TODO improve dependency starting/restarting
# TODO evaluate if creating symlinks is a better way for managing these
Upholds=k3s-apiserverlb@0.service
Before=k3s-apiserverlb@0.service

Upholds=k3s-svc-lb@0.service
Before=k3s-svc-lb@0.service

Upholds=k3s-agent@0.service
Before=k3s-agent@0.service

[Service]
Environment=NODE_EXTERNAL_IP="10.50.0.2"

[Service]
Environment="NODE_IP=10.10.0.2"
Environment="SERVICE_IP=10.43.2.2"

[Container]
# https://docs.k3s.io/cli/server#cluster-options
Environment="K3S_CLUSTER_INIT=true"
Environment="K3S_KUBECONFIG_OUTPUT=/root/admin.kubeconfig"

# TODO consider removing interface_name if not needed
Network=kube-server.network:ip=${NODE_IP},interface_name=server0
Network=kube-service.network:ip=${SERVICE_IP},interface_name=service0

