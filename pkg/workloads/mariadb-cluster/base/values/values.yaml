---
# yaml-language-server: $schema=../../../../schemas/mariadb-cluster/values.schema.json

nameOverride: ""
fullnameOverride: "mariadb"
namespaceOverride: "mariadb"

# yaml-language-server-disable Missing property
mariadb:
  nodeSelector:
    k8s.mariadb.com/node: "" 

  env:
  - name: TZ
    value: UTC

  rootPasswordSecretKeyRef:
    name: "mariadb-root"
    key: root
    generate: true

users: []
grants: []
backups: []
physicalBackups: []

databases:
  - name: mariadb-sys
    characterSet: utf8
    collate: utf8_general_ci
    cleanupPolicy: Delete
    requeueInterval: 10h
    retryInterval: 30s
