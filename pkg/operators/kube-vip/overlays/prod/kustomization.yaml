---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: helmcharts/kube-vip-patch.yaml
    target:
      group: helm.cattle.io
      version: v1
      kind: HelmChart
      name: kube-vip
      namespace: kube-system

secretGenerator:
  - name: kube-vip-values
    namespace: kube-system
    behavior: merge
    files:
      - 20-prod-values.yaml=values/20-values.yaml
