---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cnpg-cluster
  namespace: kube-system
spec:
  # https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/Chart.yaml
  chart: https://%{KUBERNETES_API}%/static/charts/cluster-0.5.0.tgz

  targetNamespace: cnpg-cluster
  createNamespace: true
  takeOwnership: true
  failurePolicy: abort

  set:
    global.systemDefaultRegistry: ""
  # https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/README.md
  valuesSecrets:
  - name: cnpg-cluster-values
    ignoreUpdates: false
    keys:
      - cluster.yaml
      - version.yaml
      - database.yaml
