---
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: kubevirt-staging

servers: 1
agents: 1
image: docker.io/rancher/k3s:v1.35.5-k3s1
network: k3d

kubeAPI:
  host: "host.containers.internal"
  hostIP: "127.0.0.1"
  hostPort: "6550"

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

