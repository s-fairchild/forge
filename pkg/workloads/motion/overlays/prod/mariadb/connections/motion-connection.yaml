---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Connection
metadata:
  name: mariadb-motion-connection
  namespace: motion
# https://github.com/mariadb-operator/mariadb-operator/blob/main/docs/api_reference.md#connectionspec
spec:
  mariaDbRef:
    name: mariadb
    namespace: mariadb

  username: motion
  database: motion
  serviceName: mariadb

  secretTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: motion
      annotations:
        app.kubernetes.io/managed-by: mariadb-operator

    key: DSN
    usernameKey: USER
    passwordKey: PASSWORD
    hostKey: HOST
    portKey: PORT
    databaseKey: DBNAME
  
  passwordSecretKeyRef:
    name: mariadb-motion-auth
    key: motion

  healthCheck:
    interval: 30s
    retryInterval: 5s
