---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: motion-sqljobs
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
    namespace: mariadb

  database: motion
  username: motion-sqljobs
  host: "%"
  cleanupPolicy: Delete
  retryInterval: 5s

  privileges:
  - CREATE
  - UPDATE
  - SELECT
