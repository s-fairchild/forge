---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

secretGenerator:
- name: web-password
  namespace: jellyfin
  files:
  - web.password.txt

patches:
- path: deployment.yaml

- path: pvc/metadata-pvc-patch.yaml
  target:
    version: v1
    kind: PersistentVolumeClaim
    name: metadata-pvc
    namespace: jellyfin

- path: pvc/cache-pvc-patch.yaml
  target:
    version: v1
    kind: PersistentVolumeClaim
    name: cache-pvc
    namespace: jellyfin

- path: pvc/config-pvc-patch.yaml
  target:
    version: v1
    kind: PersistentVolumeClaim
    name: config-pvc
    namespace: jellyfin

- path: pvc/data-pvc-patch.yaml
  target:
    version: v1
    kind: PersistentVolumeClaim
    name: data-pvc
    namespace: jellyfin

- path: pvc/media-pvc-patch.yaml
  target:
    version: v1
    kind: PersistentVolumeClaim
    name: media-pvc
    namespace: jellyfin

- path: pvc/transcodes-pvc-patch.yaml
  target:
    version: v1
    kind: PersistentVolumeClaim
    name: transcodes-pvc
    namespace: jellyfin

- path: pvc/plugins-pvc-patch.yaml
  target:
    version: v1
    kind: PersistentVolumeClaim
    name: plugins-pvc
    namespace: jellyfin

- path: pvc/log-pvc-patch.yaml
  target:
    version: v1
    kind: PersistentVolumeClaim
    name: log-pvc
    namespace: jellyfin

- path: ingressroutes/web-svc-ir-patch.yaml
  target:
    version: v1alpha1
    group: traefik.io
    kind: IngressRoute
    name: web-svc-ir
    namespace: jellyfin

- path: middlewares/web-svc-headers-patch.yaml
  target:
    version: v1alpha1
    group: traefik.io
    kind: Middleware
    name: web-svc-headers-mw
    namespace: jellyfin
