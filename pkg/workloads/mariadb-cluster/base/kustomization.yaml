---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmcharts/mariadb-cluster.yaml
  - namespace.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
- name: mariadb-cluster-values
  namespace: kube-system
  files:
    - base-values.yaml=values/values.yaml
