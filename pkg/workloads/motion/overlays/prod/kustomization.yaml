---
resources:
- ../../base
- certificates/mariadb-motion-client-cert.yaml

- mariadb/connections/motion-connection.yaml
- mariadb/connections/sqljobs-connection.yaml
- mariadb/grants/motion-grant.yaml
- mariadb/grants/sqljobs-grant.yaml
- mariadb/sqljobs/sql-01-create-security-table-sqljob.yaml
- mariadb/users/motion-user.yaml
- mariadb/users/sqljobs-user.yaml
- mariadb/database.yaml

- middlewares/webcontrol-svc-stripprefix-mw.yaml

patches:
  - path: deployments/motion-deployment-patch.yaml
    target:
      version: v1
      group: apps
      kind: Deployment
      name: motion
      namespace: motion

  - path: deployments/motion-deployment-volumes-patch.yaml
    target:
      version: v1
      group: apps
      kind: Deployment
      name: motion
      namespace: motion

  - path: deployments/motion-deployment-init-containers-patch.yaml
    target:
      version: v1
      group: apps
      kind: Deployment
      name: motion
      namespace: motion

  - path: ingress-routes/webcontrol-svc-ir-patch.yaml
    target:
      version: v1alpha1
      group: traefik.io
      kind: IngressRoute
      name: webcontrol-svc-ir
      namespace: motion

  - path: middlewares/webcontrol-svc-secured-chain-mw-patch.yaml
    target:
      version: v1alpha1
      group: traefik.io
      kind: Middleware
      name: webcontrol-svc-secured-chain-mw
      namespace: motion

  - path: pvc/recordings-pvc-patch.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: recordings-pvc
      namespace: motion
  
  - path: certificates/webcontrol-motion-cert-patch.yaml
    target:
      version: v1
      group: cert-manager.io
      kind: Certificate
      name: webcontrol-motion-cert
      namespace: motion

  - path: namespace-patch.yaml
    target:
      version: v1
      kind: Namespace
      name: motion

generatorOptions:
  disableNameSuffixHash: true

# TODO Create configmaps for sound devices, libcamera, rtsp cameras
configMapGenerator:
  - name: motion-system-conf
    namespace: motion
    behavior: merge
    envs:
    - configmaps/motion-system-conf.env

  - name: motion-image-conf
    namespace: motion
    behavior: merge
    envs:
    - configmaps/motion-image-conf.env

  - name: motion-movies-conf
    namespace: motion
    behavior: merge
    envs:
    - configmaps/motion-movies-conf.env

  - name: motion-webcontrol-conf
    namespace: motion
    behavior: merge
    envs:
    - configmaps/motion-webcontrol-conf.env

  - name: motion-stream-conf
    namespace: motion
    behavior: merge
    envs:
    - configmaps/motion-stream-conf.env

  - name: motion-cameras-cm
    namespace: motion
    behavior: create
    files:
    - configmaps/camera1.conf

  - name: sql-01-create-security-table
    namespace: motion
    behavior: create
    files:
    - jobs.sql=mariadb/sqljobs/sql/sql-01-create-security-table.sql

    # Move this into base if other overlays will be sharing sql statements
  - name: motion-conf-sql-statements-cm
    namespace: motion
    behavior: create
    # SQL statements are placed in .sql files (rather than env files) to allow sql linting
    files:
    - EVENT_START=mariadb/sql/event-start.sql
    - EVENT_END=mariadb/sql/event-end.sql
    - MOVIE_START=mariadb/sql/movie-start.sql
    - MOVIE_END=mariadb/sql/movie-end.sql
    - PIC_SAVE=mariadb/sql/pic-save.sql

secretGenerator:
  - name: mariadb-motion-auth
    namespace: motion
    behavior: create
    files:
    - motion=secrets/mariadb-motion-auth.txt
    options:
      labels:
        k8s.mariadb.com/watch: ""

  - name: mariadb-motion-auth
    namespace: motion
    behavior: merge
    files:
    - sqljobs=secrets/mariadb-motion-sqljobs-auth.txt
    options:
      labels:
        k8s.mariadb.com/watch: ""

  - name: motion-webcontrol-authentication
    namespace: motion
    behavior: create
    envs:
    - secrets/motion-webcontrol-authentication.txt
