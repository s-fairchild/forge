# yaml-language-server: https://github.com/k3d-io/k3d/blob/main/pkg/config/v1alpha5/schema.json
# https://k3d.io/v5.4.1/usage/configfile/
---
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: kubevirt-staging

servers: 1
agents: 1
image: docker.io/rancher/k3s:v1.35.5-k3s1
network: k3d

kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
  hostPort: "6550"

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

volumes: # repeatable flags are represented as YAML lists
  - volume: /dev/kvm:/dev/kvm # same as `--volume '/dev/kvm:/dev/kvm@server:0;agent:*'`
    nodeFilters:
      - server:0
      - agent:*

# Rootless Podman runs cluster containers in a user namespace, where the kubelet's
# OOM watcher can't open /dev/kmsg ("operation not permitted") -- this crashes the
# embedded kubelet (and with it the whole k3s process) a few seconds after every
# server/agent start. KubeletInUserNamespace tells kubelet to skip that watcher.
options:
  k3s:
    extraArgs:
      - arg: "--kubelet-arg=feature-gates=KubeletInUserNamespace=true"
        nodeFilters:
          - "server:*"
          - "agent:*"
