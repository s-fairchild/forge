---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - namespace.yaml
  - configmaps/custom-local-records.yaml
  - configmaps/dnsmasq-conf-port.yaml
  - configmaps/pihole-cname-records.yaml

secretGenerator:
  - name: web-portal-auth
    namespace: pihole
    behavior: create
    envs:
      - secrets/web-portal-auth.env
    options:
      disableNameSuffixHash: true
