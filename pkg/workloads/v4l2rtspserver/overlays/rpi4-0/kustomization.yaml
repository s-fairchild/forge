---
resources:
- ../../base
- certificates/rtsp0-client-cert.yaml
- certificates/rtsp0-server-cert.yaml
- servers-transport-tcp/rtsp0-tcp-transport.yaml

patches:
  - path: deployment.yaml

  - path: ingress-routes/rtsp-hls-ir-patch.yaml
    target:
      version: v1alpha1
      group: traefik.io
      kind: IngressRoute
      name: rtsp-hls-ingressroute
      namespace: v4l2rtspserver

  - path: namespace-patch.yaml
    target:
      version: v1
      kind: Namespace
      name: v4l2rtspserver

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
- name: rtsp0-auth
  namespace: v4l2rtspserver
  envs:
  - secrets/rtsp0-password.env
