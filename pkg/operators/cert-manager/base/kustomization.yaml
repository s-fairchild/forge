---
kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
- helmcharts/cert-manager.yaml
- certificate/root-ca.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: cert-manager-values
    namespace: kube-system
    files:
      - values/values.yaml
