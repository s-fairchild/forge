---
- op: add
  path: /spec/template/spec/initContainers/0/envFrom/-
  value:
    configMapRef:
      name: motion-conf-sql-statements-cm
    prefix: SQL_

- op: add
  path: /spec/template/spec/initContainers/0/envFrom/-
  value:
    secretRef:
      name: mariadb-motion-connection
    prefix: DATABASE_
- op: add
  path: /spec/template/spec/initContainers/0/envFrom/-
  value:
    secretRef:
      name: motion-webcontrol-authentication

- op: add
  path: /spec/template/spec/initContainers/0/env
  value:
    - name: DATABASE_TYPE
      value: mariadb
