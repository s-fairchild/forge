# References:
#   * https://intel.github.io/intel-device-plugins-for-kubernetes/cmd/operator/README.html
---
kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
- namespace.yaml
- helmcharts/device-plugins-operator.yaml
- certificates/inteldeviceplugins-serving-cert.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: intel-device-plugins-operator-values
    namespace: kube-system
    files:
      - values/values.yaml

# https://github.com/kubernetes-sigs/kustomize/issues/815#issuecomment-722675365
crds:
  - crds/helmcharts-cattle-openapi-spec.yaml
