---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmcharts/traefik-crd.yaml
  - helmcharts/traefik.yaml
  - certificates/default-certificate.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: traefik-custom-values
    namespace: kube-system
    behavior: create
    files:
      - base-values.yaml=values/values.yaml
