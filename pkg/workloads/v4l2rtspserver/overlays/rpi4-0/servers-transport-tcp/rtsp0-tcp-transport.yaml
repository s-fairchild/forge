---
apiVersion: traefik.io/v1alpha1
kind: ServersTransportTCP
metadata:
  name: rtsp0-transport
  namespace: v4l2rtspserver
spec:
  # Note: Currently unused. motion is connecting via the service dns name, bypassing this transport.
  # proxyProtocol:
    # version: 2

  terminationDelay: 200ms

  tls:
    serverName: rtsp0.v4l2rtspserver.svc

    certificatesSecrets:
    - rtsp0-server-cert
    - rtsp0-client-cert

    rootCAsSecrets:
    - root-ca-bundle

    insecureSkipVerify: true
