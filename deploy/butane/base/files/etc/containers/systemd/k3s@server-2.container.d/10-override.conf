[Unit]
Wants=k3s@server-0.service
After=k3s@server-0.service
Wants=k3s@server-1.service

[Container]
PodmanArgs=--oom-score-adj=-900 --privileged
Memory=8g
HealthCmd=k3s kubectl get --raw=/healthz
HealthStartPeriod=90s
Secret=k3s-token,type=mount,mode=0400
Secret=k3s-agent-token,type=mount,mode=0400
# https://docs.k3s.io/cli/server#cluster-options
Environment="K3S_AGENT_TOKEN_FILE=/run/secrets/k3s-agent-token"
Environment="K3S_KUBECONFIG_OUTPUT=/mnt/kubeconfig/admin.kubeconfig"
Volume=kubeconfig.volume:/mnt/kubeconfig:z,rshared
# https://docs.k3s.io/installation/configuration#configuration-file
Volume=/usr/local/etc/k3s/k3s@server.yaml:/etc/rancher/k3s/config.yaml.d/00-role.yaml:Z,ro
Exec=server --node-ip=${NODE_IP}

# TODO consider removing interface_name if not needed
Network=kube-server.network:ip=${NODE_IP},interface_name=server0
Network=kube-service.network:ip=${SERVICE_IP},interface_name=service0
