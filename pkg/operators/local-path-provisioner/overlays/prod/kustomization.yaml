---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: helmcharts/local-path-provisioner-patch.yaml
    target:
      version: v1
      group: helm.cattle.io
      kind: HelmChart
      name: local-path-provisioner
      namespace: kube-system

secretGenerator:
  - name: local-path-provisioner-values
    namespace: kube-system
    behavior: replace
    files:
      - values/values.yaml
      - values/configmap.yaml
      - values/helper-pod.yaml
