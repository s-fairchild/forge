---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmcharts/traefik-crd.yaml
  - helmcharts/traefik.yaml
  - certificate/default-certificate.yaml
  - tlsstore/default.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: traefik-custom-values
    namespace: kube-system
    files:
      - values/values.yaml

# https://github.com/kubernetes-sigs/kustomize/issues/815#issuecomment-722675365
crds:
  - crds/helmcharts-cattle-openapi-spec.yaml
