---
# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/tags/v39.0.2/traefik/values.schema.json

service:
  enabled: true

  single: true
  type: LoadBalancer
  ipFamilyPolicy: "SingleStack"

  spec:
    internalTrafficPolicy: Cluster
    trafficDistribution: PreferSameZone
    sessionAffinity: ClientIP

  ipFamilies:
  - IPv4

  loadBalancerSourceRanges:
  - 10.50.0.0/24

  additionalServices:
    internal:
      enabled: true
      labels:
        traefik-service-label: internal

      type: ClusterIP

      spec:
        trafficDistribution: PreferSameZone
        sessionAffinity: ClientIP

      single: true
      ipFamilyPolicy: "SingleStack"
      ipFamilies:
      - IPv4

      loadBalancerSourceRanges:
      - 10.11.0.0/16
      - 10.10.0.0/16
      - 10.16.0.0/16
      - 10.43.0.0/16

ports:
  traefik:
    port: 9000
    exposedPort: 9000
    protocol: TCP

    expose:
      default: false
      internal: true

  rtsp-tcp:
    port: 8555
    exposedPort: 8555
    protocol: TCP

    expose:
      default: false
      internal: true

  rtsp-udp:
    port: 8554
    exposedPort: 8554
    protocol: UDP

    expose:
      default: false
      internal: true

  web:
    port: 80
    exposedPort: 80
    targetPort: web
    protocol: TCP

    expose:
      default: true

    forwardedHeaders:
      trustedIPs:
      - 10.50.0.0/24
      - 10.11.0.0/16
      - 10.10.0.0/16
      - 10.16.0.0/16
      - 10.43.0.0/16
      insecure: false

  websecure:
    asDefault: true
    port: 443
    exposedPort: 443
    targetPort: websecure
    protocol: TCP
    appProtocol: https

    expose:
      default: true

    http3:
      enabled: false

    forwardedHeaders:
      trustedIPs: ["10.50.0.0/24"]
      insecure: false

  metrics:
    port: 9100
    exposedPort: 9100
    protocol: TCP

    expose:
      default: false

ingressRoute:
  dashboard:
    enabled: true
    matchRule: PathPrefix(`/dashboard`) || PathPrefix(`/api`)
    entryPoints: ["traefik"]

    services:
      - name: api@internal
        kind: TraefikService

  healthcheck:
    enabled: true

    matchRule: PathPrefix(`/ping`)
    entryPoints: ["traefik"]

    services:
      - name: ping@internal
        kind: TraefikService
