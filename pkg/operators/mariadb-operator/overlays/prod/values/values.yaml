---
# yaml-language-server: $schema=../../../../../schemas/mariadb-operator/values.schema.json
#
# References:
#  * [README.md](https://github.com/mariadb-operator/mariadb-operator/blob/mariadb-operator-crds-25.10.3/deploy/charts/mariadb-operator/README.md)
#  * [values.yaml](https://github.com/mariadb-operator/mariadb-operator/blob/mariadb-operator-crds-25.10.3/deploy/charts/mariadb-operator/values.yaml)
#  * [Raw values.yaml](https://raw.githubusercontent.com/mariadb-operator/mariadb-operator/refs/tags/mariadb-operator-crds-25.10.3/deploy/charts/mariadb-operator/values.yaml)

# https://github.com/mariadb-operator/mariadb-operator/blob/mariadb-operator-crds-25.10.3/docs/helm.md#high-availability
# yaml-language-server-disable Missing property
ha:
  # yaml-language-server-disable Incorrect type
  enabled: pdb
  replicas: 3

affinity:
  # yaml-language-server-disable Property podAntiAffinity is not allowed
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - mariadb-operator
        - key: app.kubernetes.io/instance
          operator: In
          values:
          - mariadb-operator
      topologyKey: kubernetes.io/hostname

pdb:
  enabled: true
  maxUnavailable: 1

# yaml-language-server-disable Missing property "galeraLibPath"
config:
  mariadbDefaultVersion: "11.8"

  mariadbImage:
    repository: docker-registry1.mariadb.com/library/mariadb
    tag: 11.8.5

  mariadbImageName: docker-registry1.mariadb.com/library/mariadb

  maxscaleImage:
    repository: docker-registry2.mariadb.com/mariadb/maxscale
    tag: 23.08.5

  exporterImage:
    repository: prom/mysqld-exporter
    tag: v0.15.1

  exporterMaxscaleImage:
    repository: docker-registry2.mariadb.com/mariadb/maxscale-prometheus-exporter-ubi
    tag: v0.0.1

# yaml-language-server-disable Missing property
webhook:
  enabled: true

  ha:
    # yaml-language-server-disable Incorrect type. Expected "boolean"
    enabled: pdb
    # -- Number of replicas
    replicas: 3

  pdb:
    enabled: true
    maxUnavailable: 1
