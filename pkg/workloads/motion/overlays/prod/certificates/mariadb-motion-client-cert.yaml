---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mariadb-motion-client-cert
  namespace: motion
spec:
  commonName: mariadb-motion-client

  usages:
    - "client auth"
    - "digital signature"
    - "key agreement"

  # TODO add motion service dns names once they have been created
  # dnsNames:
    # - mariadb-client

  secretName: mariadb-motion-client-cert
  secretTemplate:
    labels:
      enterprise.mariadb.com/watch: ""

  issuerRef:
    name: root-ca
    kind: ClusterIssuer
    group: cert-manager.io
  
  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 256
