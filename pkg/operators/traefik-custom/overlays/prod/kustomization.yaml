---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: helmcharts/traefik-patch.yaml
    target:
      kind: HelmChart
      name: traefik
      namespace: kube-system

secretGenerator:
  - name: traefik-custom-values
    namespace: kube-system
    behavior: merge
    files:
      - values/ingress-route.yaml
      - values/logs.yaml
      - values/ports.yaml
      - values/providers.yaml
      - values/service.yaml
      - values/values.yaml
