kind: HelmChart
metadata:
  name: mariadb-operator-crds
  namespace: kube-system
spec:
  # https://github.com/mariadb-operator/mariadb-operator/blob/mariadb-operator-crds-25.10.3/deploy/charts/mariadb-operator/Chart.yaml
  chart: mariadb-operator-crds
  repo: https://helm.mariadb.com/mariadb-operator
  version: 26.3.0

  set:
    global.systemDefaultRegistry: ""

  takeOwnership: true
  failurePolicy: reinstall
