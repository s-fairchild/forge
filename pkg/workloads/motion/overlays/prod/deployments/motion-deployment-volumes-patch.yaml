---
##### volumeMounts Start #####
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: renderd128
    mountPath: /dev/dri/renderD128

- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: card1
    mountPath: /dev/dri/card1

##### volumeMounts Start #####

##### volumes Start #####
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: renderd128
    hostPath:
      path: /dev/dri/renderD128
      type: CharDevice

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: card1
    hostPath:
      path: /dev/dri/card1
      type: CharDevice

##### volumes End #####
