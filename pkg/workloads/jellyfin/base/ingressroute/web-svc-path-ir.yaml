---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-svc-path-ir
  namespace: jellyfin
spec:
  entryPoints:
    - traefik
  routes:
  - match: Path(`/jellyfin`)
    kind: Rule
    middlewares:
    - name: web-svc-headers-mw
    services:
    - name: web-svc
      namespace: jellyfin
      kind: Service
      port: web
      passHostHeader: true
      responseForwarding:
        flushInterval: 1ms
      sticky:
        cookie:
          httpOnly: true
          name: cookie
          secure: true
          sameSite: none
          maxAge: 42
