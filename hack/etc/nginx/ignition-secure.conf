# hack/lib/ignition/nginx.conf
#
# Serves Ignition files (JSON) over HTTPS with self-signed certificate

server {
    listen 8081;
    listen [::]:8081;
    server_name _;
    return 301 https://$host:8080$request_uri;
}

server {
    listen 8080 ssl http2;
    listen [::]:8080 ssl http2;

    server_name _;  # Catch-all (or specify your hostname/FQDN)

    # Self-signed certificate mounted via Podman secrets
    ssl_certificate     /run/secrets/ssl-cert;
    ssl_certificate_key /run/secrets/ssl-key;

    # Recommended security settings for self-signed cert
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Disable HSTS for self-signed certificates (or set a low max-age for testing)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index config.ign index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # Logging
    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    # Serve Ignition files with correct MIME type
    location ~* \.ign$ {
        types {
            application/json ign;
        }
        add_header Content-Type application/json always;
        try_files $uri =404;
    }

    # General static file serving
    location / {
        try_files $uri $uri/ =404;
        
        # Optional: Enable directory listing only for debugging
        # autoindex on;
        # autoindex_exact_size off;
    }

    # Health check endpoint
    location = /health {
        return 200 "healthy\n";
        access_log off;
    }
}