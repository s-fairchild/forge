---
# yaml-language-server: $schema=../../../../schemas/intel-device-plugins-operator/values.schema.json
#
# References:
#   * https://github.com/intel/helm-charts/blob/main/charts/device-plugin-operator/README.md
#   * https://github.com/intel/helm-charts/blob/main/charts/device-plugin-operator/values.yaml

nodeSelector:
  kubernetes.io/arch: amd64

manager:
  image:
    hub: intel
    tag: ""
    pullPolicy: IfNotPresent

  # supported devices by the operator
  devices:
    # dsa: true
    # gpu: true
    # iaa: true
    # qat: true
    # sgx: true

privateRegistry:
  registryUrl: ""
  registryUser: ""
  registrySecret: ""

resources:
  limits:
    cpu: 100m
    memory: 120Mi
  requests:
    cpu: 100m
    memory: 100Mi

tolerations: []
