---
apiVersion: v1
kind: Service
metadata:
  name: rtsp0-svc
  namespace: v4l2rtspserver
  labels:
    app: rtsp0
spec:
  selector:
    app: rtsp0


  ports:
  - name: rtsp-tcp
    port: 555
    targetPort: rtsp-tcp

  - name: rtsp-udp
    port: 554
    targetPort: rtsp-udp
    protocol: UDP

  # TODO create this as a separate service if it will be used
  # - name: hls-web
    # port: 8086
    # targetPort: hls

  type: ClusterIP
