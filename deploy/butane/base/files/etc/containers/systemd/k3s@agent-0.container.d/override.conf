[Unit]
Wants=k3s@server-0.service
After=k3s@server-0.service

[Service]
Environment="NODE_IP=10.11.0.6"
Environment="SERVICE_IP=10.43.0.6"

[Container]
Memory=24g
PodmanArgs=--hostuser=jellyfin
Secret=k3s-agent-token,type=mount,target=k3s-token,mode=0400
# https://docs.k3s.io/cli/server#cluster-options
Environment="K3S_URL=https://10.10.0.100:6443"
Network=kube-agent.network:ip=${NODE_IP},interface_name=agent0
Network=kube-service.network:ip=${SERVICE_IP},interface_name=service0
Exec=agent --node-ip=${NODE_IP}
