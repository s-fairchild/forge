---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: cert-manager
  repo: https://charts.jetstack.io
  version: v1.20.0

  set:
    global.systemDefaultRegistry: ""

  targetNamespace: cert-manager
  takeOwnership: true
  failurePolicy: reinstall

  valuesSecrets:
  - name: cert-manager-values
    ignoreUpdates: false
    keys:
      - base-values.yaml
