---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: motion
  namespace: motion
  labels:
    app: motion
spec:
  selector:
    matchLabels:
      app: motion
  template:
    metadata:
      name: motion
      namespace: motion
      labels:
        app: motion
    spec:
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      containers:
      - name: motion
        volumeMounts:
        - name: renderd128
          mountPath: /dev/dri/renderd128
        - name: card1
          mountPath: /dev/dri/card1
        - name: cameras
          mountPath: /etc/motion/conf.d
          # Allows for sending reload signal to the motion process
          # Re-reading the updated config files
          # mountPropagation: HostToContainer
          readOnly: true
        resources:
          requests:
            memory: "10G"
            cpu: "100m"
          limits:
            memory: "10G"
            cpu: "100m"
      volumes:
      - name: cameras
        configMap:
          name: cameras-cm
          optional: false
      - name: renderd128
        hostPath:
          path: /dev/dri/renderD128
          type: CharDevice
      - name: card1
        hostPath:
          path: /dev/dri/card1
          type: CharDevice
