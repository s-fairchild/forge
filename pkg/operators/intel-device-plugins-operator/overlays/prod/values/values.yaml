---
# yaml-language-server: $schema=../../../../../schemas/intel-device-plugins-operator/values.schema.json
#
# References:
#   * https://github.com/intel/helm-charts/blob/main/charts/device-plugin-operator/README.md
#   * https://github.com/intel/helm-charts/blob/main/charts/device-plugin-operator/values.yaml

nodeSelector:
  # yaml-language-server-disable Property node-role.kubernetes.io/control-plane is not allowed
  node-role.kubernetes.io/control-plane: "true"
  kubernetes.io/arch: amd64

manager:
  image:
    hub: intel
    tag: ""
    pullPolicy: IfNotPresent

  devices:
    # yaml-language-server-disable Incorrect type. Expected "null"
    gpu: true

privateRegistry:
  registryUrl: ""
  registryUser: ""
  registrySecret: ""

resources:
  limits:
    cpu: 100m
    memory: 120Mi
  requests:
    cpu: 100m
    memory: 100Mi

tolerations:
  - key: node.kubernetes.io/disk-pressure
    operator: Exists
    effect: NoSchedule
  - key: "CriticalAddonsOnly"
    operator: "Exists"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
