# hack/etc/httpd/ignition.conf
#
# Drop-in for the httpd container: serve ignition files from /usr/share/httpd/html
# over HTTPS on port 8080 using podman secrets for the TLS certificate and key.
# config.ign is tried first; falls back to index.html if absent.

Listen 8080

<VirtualHost *:8080>
    SSLEngine on
    SSLCertificateFile    /run/secrets/ssl-cert
    SSLCertificateKeyFile /run/secrets/ssl-key

    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        HIGH:!aNULL:!MD5:!RC4
    SSLHonorCipherOrder   on
    SSLSessionCacheTimeout 600

    DocumentRoot "/usr/share/httpd/html"

    <Directory "/usr/share/httpd/html">
        Options None
        AllowOverride None
        Require all granted
        DirectoryIndex config.ign index.html
    </Directory>

    AddType application/json .ign
</VirtualHost>
