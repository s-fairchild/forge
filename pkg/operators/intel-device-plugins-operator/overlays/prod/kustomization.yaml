---
kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
- ../../base

patches:
- path: certificates/inteldeviceplugins-serving-cert-patch.yaml
  target:
    version: v1
    group: cert-manager.io
    kind: Certificate
    name: inteldeviceplugins-serving-cert
    namespace: intel-device-plugins-operator

secretGenerator:
  - name: intel-device-plugins-operator-values
    namespace: kube-system
    behavior: merge
    files:
      - values/values.yaml
