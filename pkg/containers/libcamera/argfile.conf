# rpicam-apps Build Args
# Values should not be wrapped in quotes. This breaks things due to how builda expands args.
# Reference: https://github.com/containers/buildah/issues/5945

### Build container image URI ###
IMAGE_REGISTRY=docker.io
IMAGE_REPOSITORY=library/debian
IMAGE_TAG=trixie-slim

# Build and install directory prefix passed to meson
PREFIX=/usr/local

# https://github.com/raspberrypi/libcamera/tree/main
LIBCAMERA_VERSION=main

# Meson build args
# https://www.raspberrypi.com/documentation/computers/camera_software.html#building-libcamera
# Recommended for headless setup
BUILD_TYPE=release
ENABLE_TEST=false
# https://github.com/raspberrypi/libcamera/blob/v0.7.0%2Brpt20260205/meson_options.txt#L69
ENABLE_PIPELINES=rpi/vc4,rpi/pisp
# https://github.com/raspberrypi/libcamera/blob/v0.7.0%2Brpt20260205/meson_options.txt#L39
ENABLE_IPAS=rpi/vc4,rpi/pisp
# https://github.com/raspberrypi/libcamera/blob/v0.7.0%2Brpt20260205/meson_options.txt#L105
ENABLE_V4L2=enabled
# https://github.com/raspberrypi/libcamera/blob/v0.7.0%2Brpt20260205/meson_options.txt#L32
ENABLE_GSTREAMER=disabled
ENABLE_LC_COMPLIANCE=disabled
ENABLE_CAM=disabled
ENABLE_QCAM=disabled
ENABLE_DOCUMENTATION=disabled
# https://github.com/raspberrypi/libcamera/blob/v0.7.0%2Brpt20260205/meson_options.txt#L84
ENABLE_RPI_AWB_NN=disabled
# Enable udev hotplug support
# https://github.com/raspberrypi/libcamera/blob/v0.7.0%2Brpt20260205/meson_options.txt#L99
ENABLE_UDEV=enabled
# TODO impliment code to enable streaming via pycamera (newer than currentl legacy picamera interface)
# References to get started:
#   * https://www.raspberrypi.com/documentation/computers/camera_software.html#picamera2
#   * https://pip-assets.raspberrypi.com/categories/652-raspberry-pi-camera-module-2/documents/RP-008156-DS-2-picamera2-manual.pdf?disposition=inline#output-using-ffmpeg
# Github examples:
#   * https://github.com/raspberrypi/picamera2/blob/main/examples/capture_stream.py
#   * https://github.com/raspberrypi/picamera2/blob/main/examples/capture_stream_udp.py
#   * https://github.com/raspberrypi/picamera2/blob/main/examples/pyav_stream.py
#   * https://github.com/raspberrypi/picamera2/blob/main/examples/pyav_stream2.py
#   * https://github.com/raspberrypi/picamera2/blob/main/examples/capture_circular_stream.py
ENABLE_PYCAMERA=disabled
