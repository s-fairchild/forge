---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fcos
  namespace: fcos-vm
spec:
  runStrategy: Always
  # TODO Configure k3d local-path-provisioner class to be used for storing the os-disk volume
  # TODO Configure k3d with appropriate container mounts to be used by this new storage class
  dataVolumeTemplates:
  - metadata:
      name: fcos-stable-os-disk-volume
    spec:
      source:
        registry:
          url:
           docker://quay.io/fedora/fedora-coreos-kubevirt:stable
      storage:
        volumeMode: Filesystem
        resources:
          requests:
            storage: 20Gi
        accessModes:
          - ReadWriteOnce
  template:
    spec:
      networks:
      - name: default
        pod: {}
      domain:
        devices:
          interfaces:
          - name: default
            masquerade: {}
          disks:
          - name: fcos-os-disk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          rng: {}
        resources:
          requests:
            memory: 4096M
      volumes:
      # TODO Configure k3d local-path-provisioner class to be used for storing the os-disk volume
      # TODO Configure k3d with appropriate container mounts to be used by this new storage class
      - name: fcos-os-disk
        dataVolume:
          name: fcos-stable-os-disk-volume
      - name: cloudinitdisk
        cloudInitConfigDrive:
          secretRef:
            name: ignition-payload
