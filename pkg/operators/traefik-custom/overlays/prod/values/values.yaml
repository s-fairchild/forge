---
# https://doc.traefik.io/traefik-hub/api-gateway/reference/install/ref-helm
# yaml-language-server: $schema=https://raw.githubusercontent.com/k3s-io/k3s-charts/refs/heads/main/charts/traefik/39.0.201%2Bup39.0.2/.schema.yaml
#
# Documentation:
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/values.yaml
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/VALUES.md
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/README.md
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/EXAMPLES.md
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/Guidelines.md
#   * https://github.com/k3s-io/k3s-charts/blob/main/charts/traefik/39.0.201%2Bup39.0.2/Changelog.md

deployment:
  podAnnotations:
    prometheus.io/port: "8082"
    prometheus.io/scrape: "true"

image:
  registry: docker.io
  repository: "rancher/mirrored-library-traefik"
             # rancher/mirrored-library-traefik
  # -- defaults to appVersion. It's used for version checking, even prefixed with experimental- or latest-.
  # When a digest is required, `versionOverride` can be used to set the version.
  tag: "3.6.9"
  pullPolicy: IfNotPresent

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

tolerations:
- key: "CriticalAddonsOnly"
  operator: "Exists"
- key: "node-role.kubernetes.io/control-plane"
  operator: "Exists"
  effect: "NoSchedule"
- key: "node-role.kubernetes.io/master"
  operator: "Exists"
  effect: "NoSchedule"

priorityClassName: "system-cluster-critical"

hostNetwork: false

rbac:
  enabled: true
  # If set to false, installs ClusterRole and ClusterRoleBinding so Traefik can be used across namespaces.
  # If set to true, installs Role and RoleBinding. Providers will only watch target namespace.
  namespaced: false

# -- The service account the pods will use to interact with the Kubernetes API
serviceAccount:
  # If set, an existing service account is used
  # If not set, a service account is created automatically using the fullname template
  name: ""

# -- TLS Store are created as [TLSStore CRDs](https://doc.traefik.io/traefik/https/tls/#default-certificate). This is useful if you want to set a default certificate. See EXAMPLE.md for details.
tlsStore:
  default:
    defaultCertificate:
      secretName: default-certificate
